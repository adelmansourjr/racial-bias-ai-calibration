name: Native-token activation gate
on:
  push:
    paths: ['native-token-activation-gate/**', '.github/workflows/native-token-activation-gate.yml']
  pull_request:
    paths: ['native-token-activation-gate/**', '.github/workflows/native-token-activation-gate.yml']
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s native-token-activation-gate/tests -v
      - run: python3 native-token-activation-gate/verify.py
