[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nameguard-efficient-research"
version = "0.2.0"
description = "Native-token-count internal canonical evidence scoring with authenticated role review"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []
classifiers = ["Development Status :: 3 - Alpha", "Programming Language :: Python :: 3"]

[project.optional-dependencies]
mlx = ["mlx==0.32.3", "mlx-lm==0.31.3", "numpy==2.5.3", "transformers==5.18.0", "tokenizers==0.23.2"]

[tool.setuptools.packages.find]
where = ["src"]
