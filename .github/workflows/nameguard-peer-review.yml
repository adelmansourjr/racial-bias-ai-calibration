name: Admission-aware NameGuard review package
on:
  push:
    paths: ['nameguard-peer-review/**', '.github/workflows/nameguard-peer-review.yml']
  pull_request:
    paths: ['nameguard-peer-review/**', '.github/workflows/nameguard-peer-review.yml']
permissions:
  contents: read
jobs:
  public-artifact-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s nameguard-peer-review/tests -v
      - run: python3 -m unittest discover -s native-token-gate-hardening/tests -v
      - run: python3 nameguard-peer-review/verify.py
      - run: python3 nameguard-peer-review/analyze.py
      - run: python3 nameguard-peer-review/review_followups.py
