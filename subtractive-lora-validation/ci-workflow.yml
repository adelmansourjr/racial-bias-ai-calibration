name: Subtractive LoRA validation
on:
  push:
    paths: ['subtractive-lora-validation/**', '.github/workflows/subtractive-lora-validation.yml']
  pull_request:
    paths: ['subtractive-lora-validation/**', '.github/workflows/subtractive-lora-validation.yml']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s subtractive-lora-validation/tests -v
      - run: python3 subtractive-lora-validation/verify_public.py
