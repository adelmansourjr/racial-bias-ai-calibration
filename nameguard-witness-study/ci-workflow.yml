name: NameGuard evidence witness study
on:
  push:
    paths: ['nameguard-witness-study/**', '.github/workflows/nameguard-witness.yml']
  pull_request:
    paths: ['nameguard-witness-study/**', '.github/workflows/nameguard-witness.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s nameguard-witness-study/tests -v
      - run: python3 nameguard-witness-study/verify.py
      - run: python3 nameguard-utility-study/verify.py
