name: Native token gate hardening
on:
  push:
    paths: ['native-token-gate-hardening/**', '.github/workflows/native-token-gate-hardening.yml']
  pull_request:
    paths: ['native-token-gate-hardening/**', '.github/workflows/native-token-gate-hardening.yml']
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s native-token-gate-hardening/tests -v
      - run: python3 native-token-gate-hardening/verify.py
